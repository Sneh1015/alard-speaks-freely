{% extends "base.html" %}
{% block content %}
{# Port of src/pages/AdminLogin.tsx #}
<div class="container mx-auto px-4 py-16 max-w-md">
  <div data-reveal="load" data-y="20">
    <div class="{{ card() }}">
      <div class="{{ card_header('text-center') }}">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-xl bg-hero-gradient mb-4">
          {{ icon('shield', 'h-7 w-7 text-accent') }}
        </div>
        <h3 class="{{ card_title('font-display text-2xl') }}">Admin Login</h3>
        <p class="{{ card_description() }}">Sign in to access the complaint management dashboard.</p>
      </div>
      <div class="{{ card_content() }}">
        <form method="post" action="/admin/login" class="space-y-4" data-login-form>
          <div class="space-y-2">
            <label for="email" class="{{ label_cls() }}">Email</label>
            <input id="email" name="email" type="email" class="{{ input_cls() }}" placeholder="admin@alard.edu" value="{{ email }}" />
          </div>
          <div class="space-y-2">
            <label for="password" class="{{ label_cls() }}">Password</label>
            <input id="password" name="password" type="password" class="{{ input_cls() }}" placeholder="••••••••" />
          </div>
          <button type="submit" class="{{ btn('default', 'default', 'w-full gap-2') }}" data-submit-button data-busy-text="Signing in...">
            {{ icon('log-in', 'h-4 w-4') }}
            <span data-label>Sign In</span>
          </button>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
